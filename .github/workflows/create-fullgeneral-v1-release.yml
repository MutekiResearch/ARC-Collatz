name: Create Full General ARC v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-fullgeneral-v1-release.yml'
      - 'releases/full-general-arc-v1.0.0.md'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare checksums
        run: |
          sha256sum             papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_English.pdf             papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_English.tex             papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_Japanese.pdf             lean/ARC_FullGeneral_NoCobham_Lean4_Source.zip             > FullGeneralARC_v1.0.0_SHA256SUMS.txt

      - name: Create immutable release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: full-general-arc-v1.0.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "Full General ARC — Cobham-Free Closure v1.0.0"             --notes-file releases/full-general-arc-v1.0.0.md             papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_English.pdf             papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_English.tex             papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_Japanese.pdf             lean/ARC_FullGeneral_NoCobham_Lean4_Source.zip             FullGeneralARC_v1.0.0_SHA256SUMS.txt
