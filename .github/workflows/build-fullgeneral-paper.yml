name: Build Full General ARC paper

on:
  push:
    branches: [main]
    paths:
      - 'papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_English.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Build PDF
        working-directory: papers/ARC_FullGeneral_NoCobham
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error ARC_FullGeneral_NoCobham_English.tex

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/ARC_FullGeneral_NoCobham/ARC_FullGeneral_NoCobham_English.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build expanded Full General ARC paper"
            git push
          fi
